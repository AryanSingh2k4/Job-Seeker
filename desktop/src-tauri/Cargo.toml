[package]
name = "jobseeker-desktop"
version = "0.1.0"
description = "JobSeeker — truthful, tailored, human-checked job applications"
edition = "2021"
rust-version = "1.77.2"

# The Tauri app binary (built from src/main.rs) plus the Week-0 stub sidecar
# (src/bin/autojob_core_stub.rs) that emulates the real Python sidecar's
# `AUTOJOB_READY` stdout handshake (DESKTOP_PACKAGING_SPEC.md §3.1, §4).
[[bin]]
name = "jobseeker"
path = "src/main.rs"

[[bin]]
name = "autojob-core-stub"
path = "src/bin/autojob_core_stub.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
