<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYNTHETIC FIXTURE — challenge present: Arkose</title>
<!--
  SYNTHETIC FIXTURE — NOT a recording of a live challenge page.
  Replicates only the DOM signatures the engine detects (docs/form_automation_engine_design.md §7.4):
    arkose (div.arkose-box) and #captcha-internal
  plus an inert arkoselabs iframe. No scripts are loaded, the challenge is never renderable,
  and nothing here can solve or bypass anything: the markers exist so the detector can be
  asserted to freeze automation. The post-solve counterpart is captcha/captcha_cleared.html
  (identical page with this marker block removed).
  Self-contained: no network requests, no timestamps, no random ids.
-->
<style>
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #fafafa; color: #222; }
  main { max-width: 560px; margin: 48px auto; padding: 24px; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #999; border-radius: 4px; font-size: 14px; }
  button { margin-top: 16px; padding: 8px 18px; border: 0; border-radius: 16px; background: #0a66c2; color: #fff; font-weight: 600; cursor: pointer; }
  .challenge-block { margin-top: 20px; padding: 12px; border: 1px solid #e0e0e0; border-radius: 4px; background: #f9f9f9; }
  .arkose-box { width: 100%; min-height: 200px; background: #fff; border: 1px solid #ccc; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
  #captcha-internal { width: 100%; text-align: center; }
  iframe { border: 0; }
</style>
</head>
<body>
<main>
  <h1>Apply to Backend Engineer &mdash; Example Corp</h1>
  <p>This synthetic page carries an Arkose signature so tests can assert the CAPTCHA freeze path.</p>

  <form id="application-form" method="post" action="#">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email">
    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" autocomplete="tel">
    <button type="submit">Submit application</button>
  </form>

  <!-- Inert Arkose signature block (detection markers: arkose, #captcha-internal). -->
  <div class="challenge-block" id="challenge-block">
    <div class="arkose-box" id="arkose-box" data-pkey="FIXTURE-NOT-A-REAL-PUBLIC-KEY">
      <div id="captcha-internal" data-captcha-provider="arkose">
        <iframe src="https://client-api.arkoselabs.com/v2/FIXTUREPUBLICKEY/index.html" title="Arkose challenge pending" name="fixture-arkose-challenge" width="300" height="200" role="presentation" scrolling="no" frameborder="0" allow="publickey-credentials-get"></iframe>
      </div>
    </div>
  </div>
</main>
</body>
</html>
