  <meta name="description" content="WHO ARE WE?

Cohere is the leading security-first enterprise AI company.  We build cutting-edge foundation AI models and end-to-end products that are designed to solve real-world business problems.

We’re training and deploying frontier models for enterprises who are building AI systems. We believe that our work is instrumental to the widespread adoption of AI and we are looking for folks that want to be part of that.

We obsess over what we build. Each one of us is responsible for contributing to increasing the capabilities of our models and the value they drive for our customers. Cohere is a team of researchers, engineers, designers, and more, who are all passionate about their craft.

We are a global technology company headquartered in Toronto with key offices in London, New York City, San Francisco, Montreal, Paris, Berlin and Seoul. Join us!


WHY THIS ROLE?

This role is for people who love building tools for their coworkers. The Internal Applications team creates tools that help us create better models. In this role you will collaborate with internal stakeholders, which include annotators, ML researchers, product managers and more. Join our team of builders who create tooling that will pave the way for the next generation of large language models!


AS A FULL-STACK SOFTWARE ENGINEER ON THE INTERNAL APPLICATIONS TEAM, YOU WILL:

 - Work with a small talented and enthusiastic team of software engineers

 - Contribute to delightful experiences for our user-facing products, meticulously crafting code for browsers and servers

 - Collaborate and grow with your engineering colleagues of all levels through direct pairing sessions, architectural designs, documentation and talks

 - Identify and remove roadblocks to enable your team to increase its engineering velocity.

 - Build resilient systems that are mission-critical

 - Keep up with the cutting edge and adopt new technologies to improve performance and reliability


YOU MAY BE A GOOD FIT IF:

 - You have experience shipping products with a large number of stakeholders

 - You’re comfortable with the front and back end of the stack, and have previously worked with Next.js, TypeScript, React, and Python

 - You have hands-on experience with complex SQL queries

 - You have excellent communication skills and believe that documentation is a great way to get feedback and discuss technical implementations and designs

 - You’re excited to add new technologies to your toolbox and use them where it makes sense

 - You have the ability to take complex needs and goals and develop easy to understand explanations for all audiences

 - You’re excited about AI and have the motivation to scale a company


FULL-TIME EMPLOYEES AT COHERE ENJOY THESE PERKS:

 - A weekly lunch stipend of $75/£75 or equivalent in your local currency for lunch.

 - Full health and dental benefits, including a separate budget for mental health.

 - RRSP matching, 401K, Pension Scheme.

 - 100% Parental Leave top-up for up to 6 months, for either parent.

 - Annual enrichment benefits:
   
   Arts &amp; culture, fitness/wellness, quality time, and a workspace improvement credit.
   
   Education &amp; learning stipend for conferences, courses, and coaching.

 - 6 weeks of paid vacation (30 working days!)

 - Budget for traveling to other offices if you are remote, plus an annual company offsite.


HOW AND WHERE WE WORK:

 - Cohere is remote-friendly, but we also have offices in Toronto, London, New York City, San Francisco, Montreal, Paris, Berlin and Seoul with more opening soon.

 - For those in the office: a daily lunch program, plenty of snacks, and regular community and social events.

 - For those not near an office: a co-working benefit so you can work alongside others in your city.

 - Everyone receives a $500 home office stipend to set up your workspace properly.

If any of the above doesn’t line up exactly with your experience, we still encourage you to apply. 


We strive to create an inclusive work environment for all; we welcome applicants from all backgrounds and are committed to providing equal opportunities. Should you require any accommodations during the recruitment process, please submit an Accommodations Request Form https://docs.google.com/forms/d/12a6IrLdF3kI2nonKSr4tiFuz18rLQbaeYV-JM9L4o9Q/edit, and we will work together to meet your needs.

We may use AI-enabled tools to screen and assess applicants against the criteria for this position. This helps our recruiters identify potentially qualified candidates, but it doesn&#39;t limit the applications our recruiters may review or consider.

Beware of Scams: Cohere will never ask for payment or third-party services (e.g., CV writing) as part of our hiring process. All legitimate roles are listed on the Cohere careers page and LinkedIn only, with all communications from Cohere employees coming from an @cohere.com or @cw.cohere email alias. If jobs are viewed on other sites then please verify these through our official careers https://cohere.com/careers page." />

s role?</h2><p style=\"min-height:1.5em\">This role is for people who love building tools for their coworkers. The Internal Applications team creates tools that help us create better models. In this role you will collaborate with internal stakeholders, which include annotators, ML researchers, product managers and more. Join our team of builders who create tooling that will pave the way for the next generation of large language models!</p><p style=\"min-height:1.5em\"></p><h2><strong>As a Full-Stack Software Engineer on the Internal Applications team, you will:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Work with a small talented and enthusiastic team of software engineers</p></li><li><p style=\"min-height:1.5em\">Contribute to delightful experiences for our user-facing products, meticulously crafting code for browsers and servers</p></li><li><p style=\"min-height:1.5em\">Collaborate and grow with your engineering colleagues of all levels through direct pairing sessions, architectural designs, documentation and talks</p></li><li><p style=\"min-height:1.5em\">Identify and remove roadblocks to enable your team to increase its engineering velocity.</p></li><li><p style=\"min-height:1.5em\">Build resilient systems that are mission-critical</p></li><li><p style=\"min-height:1.5em\">Keep up with the cutting edge and adopt new technologies to improve performance and reliability</p><p style=\"min-height:1.5em\"></p></li></ul><h2><strong>You may be a good fit if:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">You have experience shipping products with a large number of stakeholders</p></li><li><p style=\"min-height:1.5em\">You’re comfortable with the front and back end of the stack, and have previously worked with Next.js, TypeScript, React, and Python</p></li><li><p style=\"min-height:1.5em\">You have hands-on experience with complex SQL queries</p></li><li><p style=\"min-height:1.5em\">You have excellent communication skills and believe that documentation is a great way to get feedback and discuss technical implementations and designs</p></li><li><p style=\"min-height:1.5em\">You’re excited to add new technologies to your toolbox and use them where it makes sense</p></li><li><p style=\"min-height:1.5em\">You have the ability to take complex needs and goals and develop easy to understand explanations for all audiences</p></li><li><p style=\"min-height:1.5em\">You’re excited about AI and have the motivation to scale a company</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>Full-Time Employees at Cohere enjoy these Perks:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">A weekly lunch stipend of $75/£75 or equivalent in your local currency for lunch.</p></li><li><p style=\"min-height:1.5em\">Full health and dental benefits, including a separate budget for mental health.</p></li><li><p style=\"min-height:1.5em\">RRSP matching, 401K, Pension Scheme.</p></li><li><p style=\"min-height:1.5em\">100% Parental Leave top-up for up to 6 months, for either parent.</p></li><li><p style=\"min-height:1.5em\">Annual enrichment benefits:</p><p style=\"min-height:1.5em\">Arts &amp; culture, fitness/wellness, quality time, and a workspace improvement credit.</p><p style=\"min-height:1.5em\">Education &amp; learning stipend for conferences, courses, and coaching.</p></li></ul><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">6 weeks of paid vacation (30 working days!)</p></li><li><p style=\"min-height:1.5em\">Budget for traveling to other offices if you are remote, plus an annual company offsite.</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>How and Where We Work:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Cohere is remote-friendly, but we also have offices in Toronto, London, New York City, San Francisco, Montreal, Paris, Berlin and Seoul with more opening soon.</p></li><li><p style=\"min
