[project]
name = "autojob-backend"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "curl-cffi>=0.7",
  "python-jobspy>=1.1",
  "playwright>=1.49",
  "litellm>=1.55",
  "keyring>=25",
  "fastembed>=0.4",
  "sqlite-vec>=0.1",
  "typst>=0.11",
  "pypdf>=5",
  "python-multipart>=0.0.17",
  "websockets>=13",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
  "pyinstaller>=6.10",
  "pytest-cov>=7.1.0",
]
